{% extends "layout.html" %}
{% block content %}
<div class="content_section">

<h4>Your Uploaded Documents</h4>
<ul class="list-group">
{% for doc in documents %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>
            <a href="{{ url_for('uploads.view_document', filename=doc.stored_name) }}" target="_blank">
                {{ doc.filename }}
            </a>
            - {{ doc.status }}
        </span>
        <div class="btn-group">
            <a href="{{ url_for('uploads.view_document', filename=doc.stored_name) }}" class="btn btn-sm btn-outline-secondary">
                Open
            </a>
            <form action="{{ url_for('uploads.delete_document', doc_id=doc.id) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this document?');" style="display:inline;">
                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
            </form>
        </div>
    </li>
{% else %}
    <li>No documents uploaded yet.</li>
{% endfor %}
</ul>

</div>

<!-- Modal (import the upload form here) -->
<div class="modal fade" id="uploadModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            {% include "upload_form.html" %}
        </div>
    </div>
</div>
{% endblock %}

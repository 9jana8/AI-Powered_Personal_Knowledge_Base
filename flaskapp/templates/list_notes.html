{% extends "layout.html" %}
{% block content %}
<div class="content_section">
    <form method="GET" action="{{ url_for('notes.list_notes') }}">
        <fieldset class="form-group">
            <legend class="border-bottom mb-4">Search Your Notes</legend>
            <div class="form-group">
                <input type="text" name="q" class="form-control" placeholder="Search notes..." value="{{ query }}">
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-outline-info">Search</button>
            </div>
        </fieldset>
    </form>

    <hr>

    {% if notes %}
        <ul class="list-group">
            {% for note in notes %}
                <li class="list-group-item">
                    <a href="{{ url_for('notes.note', note_id=note.id) }}">{{ note.title }}</a>
                    <p class="mb-1 text-muted">{{ note.content[:100] }}...</p>
                    <div>
                        <a href="{{ url_for('notes.update_note', note_id=note.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        <form action="{{ url_for('notes.delete_note', note_id=note.id) }}" method="POST" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No notes found.</p>
    {% endif %}

    <a href="{{ url_for('notes.new_note') }}" class="btn btn-outline-primary mt-3">Create New Note</a>
</div>
{% endblock %}
